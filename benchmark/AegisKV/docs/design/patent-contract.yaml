  kind: patent-final
  precedence: highest
  document_path: benchmark/AegisKV/docs/patent/AegisKV专利交底书-final-version.docx
  sha256: d80de557e63edfc0d77a860a262470bf3dca666340724e9a6bfe7f34a507ecb9
  provenance_manifest: benchmark/AegisKV/docs/provenance/SOURCE_MANIFEST.json
  ooxml_contract:
    paragraph_count: 215
    table_count: 3
    drawing_count: 4
    native_subscript_count: 137
