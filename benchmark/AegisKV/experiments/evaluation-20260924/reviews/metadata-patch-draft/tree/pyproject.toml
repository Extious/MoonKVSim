[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moonkvsim"
version = "0.1.0.dev0"
description = "Global-virtual-clock discrete-event simulator for vLLM and Mooncake KV systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]
trace = [
  "pyarrow>=19,<20",
]
fanoutqa = [
  "httpx>=0.28,<1",
  "tokenizers>=0.21,<1",
]
paper = [
  "matplotlib>=3.9,<4",
]

[project.scripts]
moonkv-sim = "moonkvsim.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["moonkvsim"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "python"
